[profile.default]
src = "contracts"
test = "test/foundry"
libs = ["lib", "node_modules"]
out = "out"
cache_path = "cache/foundry"
solc_version = "0.8.34"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./artifacts" }]
remappings = [
  "@openzeppelin/=node_modules/@openzeppelin/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 64

[invariant]
runs = 64
depth = 32
fail_on_revert = false
